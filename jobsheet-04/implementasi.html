<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Login Petugas</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
    </header>

    <main>
        <section style="max-width: 500px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; align-items: center">
            <h2>Login Petugas</h2>
            
            <form action="index.html" method="GET">
                <p>
                    <label for="username">Username :</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" required>
                </p>

                <p>
                    <label for="password">Password :</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </p>

                <p>
                    <button type="submit">Masuk</button>
                </p>
            </form>

            <p>
                Belum punya akun? <a href="registrasi.html">Daftar di sini</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4</p>
    </footer>
</body>
</html>
